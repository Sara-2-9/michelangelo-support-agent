#:schema node_modules/wrangler/config-schema.json
name = "michelangelo-support-agent"
main = "src/worker.ts"
compatibility_date = "2026-08-04"
# Some transitive deps (via supabase-js) import Node built-ins (fs, path).
# nodejs_compat provides them inside workerd.
compatibility_flags = ["nodejs_compat"]

# Secrets are NOT here: locally they live in .dev.vars (gitignored),
# in production they are set with `wrangler secret put <NAME>`.
# Expected vars: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#                CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN

# Static assets (the React SPA built from web/) are wired automatically
# by @cloudflare/vite-plugin (which injects the directory at dev/build).
# `directory` is set here too so that PLAIN `wrangler dev` (e.g. for
# --test-scheduled cron tests) also works from the repo root.
[assets]
directory = "web/dist/client"
not_found_handling = "single-page-application"

# Phase 1b — daily docs sync at 05:37 UTC (07:37 CEST): the Worker fetches
# the docs index + pages over HTTP and re-embeds only what changed.
[triggers]
crons = ["37 5 * * *"]
