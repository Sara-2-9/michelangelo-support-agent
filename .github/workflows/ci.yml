# CI — the PR gate. Runs the FULL Playwright suite against the STAGING
# Supabase project (real Worker + real LLM): typecheck, build, 32 E2E
# tests. Branch protection on `main` should require this check, so
# nothing untested can be merged.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Serialize CI runs: they share the STAGING Supabase project, and the seed
# step syncs the test-user password — parallel runs would overwrite each
# other's password mid-run ("Invalid login credentials" in authed.setup).
concurrency:
  group: ci-staging
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The staging env files are gitignored by design — CI rebuilds them
      # from secrets. web/.env.staging = browser (publishable key),
      # .dev.vars.staging = Worker (service role + Workers AI).
      - name: Create staging env files
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' \
            "$STAGING_SUPABASE_URL" "$STAGING_SUPABASE_ANON_KEY" > web/.env.staging
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nCLOUDFLARE_ACCOUNT_ID=%s\nCLOUDFLARE_API_TOKEN=%s\n' \
            "$STAGING_SUPABASE_URL" "$STAGING_SUPABASE_SERVICE_ROLE_KEY" \
            "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_AI_TOKEN" > .dev.vars.staging

      - run: npm run typecheck
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Idempotent: creates/syncs the E2E test user on staging.
      - run: npm run seed:test-user

      - run: npm run test:e2e:staging

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
